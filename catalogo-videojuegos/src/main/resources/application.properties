spring.application.name=catalogo-videojuegos
# Configuracion de la Base de Datos MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo_videojuegos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate (Creacion automatica de tablas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect