<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Videojuegos | IS2</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Catálogo de Videojuegos</h1>
        <p>Gestión y consulta dinámica del inventario</p>
    </header>

    <main>
        <!-- Sección 1: Filtro / Búsqueda -->
        <section aria-labelledby="titulo-busqueda">
            <h2 id="titulo-busqueda">Buscar Videojuego</h2>
            <label for="input-busqueda">Filtrar por nombre:</label>
            <input type="text" id="input-busqueda" placeholder="Ej. Zelda, Elden Ring...">
        </section>

        <!-- Sección 2: Formulario para añadir videojuegos -->
        <section aria-labelledby="titulo-formulario">
            <h2 id="titulo-formulario">Añadir Nuevo Videojuego</h2>
            <form id="form-juego">
                <div>
                    <label for="nombre">Nombre del juego:</label>
                    <input type="text" id="nombre" required placeholder="Nombre del juego">
                </div>
                <div>
                    <label for="genero">Género:</label>
                    <input type="text" id="genero" required placeholder="Ej. RPG, Acción">
                </div>
                <div>
                    <label for="precio">Precio (€):</label>
                    <input type="number" id="precio" step="0.01" min="0" required placeholder="59.99">
                </div>
                <button type="submit">Agregar Al Catálogo</button>
            </form>
        </section>

        <!-- Sección 3: Contenedor donde se mostrarán los juegos -->
        <section aria-labelledby="titulo-catalogo">
            <h2 id="titulo-catalogo">Juegos en la Lista</h2>
            <div id="contenedor-juegos">
                <!-- Aquí JavaScript insertará las tarjetas de los juegos dinámicamente -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Ingeniería del Software II | Práctica 2</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
